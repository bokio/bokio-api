components:
  securitySchemes:
    tokenAuth:
      type: http
      scheme: bearer
  schemas:
    apiError:
      type: object
      title: apiError
      properties:
        code:
          type: string
        message:
          type: string
        innerCode:
          type: string
        bokioErrorId:
          type: string
          format: uuid
    pagedResponse:
      type: object
      title: pagedResponse
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
    journalEntry:
      type: object
      title: journalEntry
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        journalEntryNumber:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/journalEntryItem"
        reversingJournalEntryId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reversedByJournalEntryId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
        - id
      example:
        id: a419cf69-db6f-4de9-992c-b1a60942a443
        title: invoice 1234
        journalEntryNumber: V342
        date: 2024-10-10
        items:
          - id: 1
            debit: 200
            credit: 0
            account: 1930
          - id: 2
            debit: 0
            credit: 40
            account: 3011
          - id: 3
            debit: 0
            credit: 160
            account: 2611
    journalEntryItem:
      type: object
      title: journalEntryItem
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        debit:
          type: number
          format: double
        credit:
          type: number
          format: double
        account:
          type: integer
          example: 1930
      example:
        id: 1
        Credit: 0
        Debit: 200
        Account: 1930
    upload:
      type: object
      title: upload
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        description:
          type: string
        contentType:
          type: string
        journalEntryId:
          type: string
          format: uuid
          nullable: true
      example:
        id: a419cf69-db6f-4de9-992c-b1a60942a443
        description: example.png
        contentType: img/png
        journalEntryId: 835ba700-b306-4bd9-8447-59207b6b0002
    customer:
      type: object
      title: customer
      required:
        - name
        - type
        - language
        - address
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        type:
          type: string
          enum:
            - company
            - private
        vatNumber:
          type: string
        orgNumber:
          type: string
        contactsDetails:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                nullable: true
                description: Should not be set for new items
              name:
                type: string
              email:
                type: string
              phone:
                type: string
              isDefault:
                type: boolean
        address:
          $ref: "#/components/schemas/address"
        language:
          type: string
          enum:
            - sv
            - en
      example:
        id: 55c899c5-82b2-47fa-9c51-e35fc9b26443
        name: customer 1
        type: company
        vatNumber: SE1234567890
        orgNumber: 123456-7890
        contactsDetails:
          - name: John Doe
            email: john@email.com
            phone: 0927-5631505
            isDefault: true
        address:
          line1: Älvsborgsvägen 10
          line2: null
          city: Göteborg
          postalCode: 123 45
          country: SE
        language: sv
    address:
      type: object
      title: address
      required:
        - line1
        - city
        - postalCode
        - country
      properties:
        line1:
          type: string
        line2:
          type: string
          nullable: true
        city:
          type: string
        postalCode:
          type: string
        country:
          description: ISO 3166-1 alpha-2 country code
          type: string
          format: country
      example:
        line1: Älvsborgsvägen 10
        line2: null
        city: Göteborg
        postalCode: 123 45
        country: SE
    invoice:
      type: object
      title: invoice
      required:
        - invoiceDate
        - dueDate
        - lineItems
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customerRef:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              readOnly: true
        invoiceNumber:
          type: string
          readOnly: true
          nullable: true
          description: The invoice number will be generated at the time of publishing the invoice.
        currency:
          description: ISO 4217 currency code
          type: string
          default: SEK
        currencyRate:
          type: number
          format: double
          default: 1
        totalAmount:
          type: number
          format: double
          readOnly: true
        totalTax:
          type: number
          format: double
          readOnly: true
        paidAmount:
          type: number
          format: double
          readOnly: true
        status:
          type: string
          enum:
            - draft
            - published
            - paid
            - overpaid
            - underpaid
            - overdue
            - credited
            - credit
          default: draft
          readOnly: true
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        lineItems:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/invoiceItem"
        billingAddress:
          readOnly: true
          oneOf:
            - $ref: "#/components/schemas/address"
      example:
        id: a419cf69-db6f-4de9-992c-b1a60942a443
        customerRef:
          id: 55c899c5-82b2-47fa-9c51-e35fc9b26443
          name: customer 1
        invoiceNumber: "1234"
        currency: SEK
        currencyRate: 1
        totalAmount: 200
        totalTax: 50
        paidAmount: 0
        status: draft
        invoiceDate: 2024-10-10
        dueDate: 2024-10-10
        lineItems:
          - id: 1
            itemRef:
              id: 55c899c5-82b2-47fa-9c51-e35fc9b26443
              description: Product 1
            description: Product 1
            itemType: salesItem
            productType: goods
            unitType: piece
            quantity: 1
            unitPrice: 100
            taxRate: 25
          - id: 2
            itemRef:
              id: e964435e-50ef-4524-a439-05ff87794952
              description: A description line
            description: A description line
            itemType: descriptionOnlyItem
        billingAddress:
          line1: Älvsborgsvägen 10
          line2: null
          city: Göteborg
          postalCode: 123 45
          country: SE
    invoiceItem:
      type: object
      title: lineItem
      oneOf:
        - $ref: "#/components/schemas/salesInvoiceItem"
        - $ref: "#/components/schemas/descriptionOnlyInvoiceItem"
    item:
      type: object
      title: item
      oneOf:
        - $ref: "#/components/schemas/salesItem"
        - $ref: "#/components/schemas/descriptionOnlyItem"
    salesItem:
      type: object
      title: salesItem
      required:
        - description
        - itemType
        - productType
        - unitType
        - unitPrice
        - taxRate
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Should not be set for new items
        description:
          type: string
        itemType:
          type: string
          enum:
            - salesItem
        productType:
          type: string
          enum:
            - goods
            - services
        unitType:
          type: string
          enum:
            - unspecified
            - piece
            - hour
            - day
            - month
            - kilogram
            - gram
            - liter
            - meter
            - centimeter
            - millimeter
            - meterSquared
            - meterCubic
            - mile
            - kilometer
            - gigabyte
            - hectar
            - words
            - year
            - week
            - minute
            - megabyte
            - ton
        unitPrice:
          type: number
          format: double
        taxRate:
          type: number
          format: double
      example:
        id: fc967153-1f8a-48d0-b773-fe3e61978263
        description: Product 1
        itemType: salesItem
        productType: goods
        unitType: piece
        unitPrice: 100
        taxRate: 25
    descriptionOnlyItem:
      type: object
      title: descriptionOnlyItem
      required:
        - description
        - itemType
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Should not be set for new items
        description:
          type: string
        itemType:
          type: string
          enum:
            - descriptionOnlyItem
      example:
        id: bd34bd41-d13b-434d-858e-092231d6228a
        description: Custom description line
        itemType: descriptionOnlyItem
    salesInvoiceItem:
      type: object
      title: salesItem
      required:
        - description
        - itemType
        - productType
        - quantity
        - unitPrice
        - taxRate
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Should not be set for new items
        itemRef:
          type: object
          title: itemRef
          nullable: true
          description: |
            Identifier of an existing salesItem to use as a template. ItemType, Quantity are required. Values in other fields will be overridden by values from this referenced item
          properties:
            id:
              type: string
              format: uuid
              description: Reference to existing salesItem id
              example: 869a69a3-632b-4a09-899e-9dc03342b5dc
            description:
              type: string
              nullable: true
              readOnly: true
        description:
          type: string
        itemType:
          type: string
          enum:
            - salesItem
        productType:
          type: string
          enum:
            - goods
            - services
        unitType:
          type: string
          default: unspecified
          enum:
            - unspecified
            - piece
            - hour
            - day
            - month
            - kilogram
            - gram
            - liter
            - meter
            - centimeter
            - millimeter
            - meterSquared
            - meterCubic
            - mile
            - kilometer
            - gigabyte
            - hectar
            - words
            - year
            - week
            - minute
            - megabyte
            - ton
        quantity:
